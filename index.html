<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintArt3D - Calculadora de Custos</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" sizes="192x192" href="./launchericon-192x192.png">
    <link rel="apple-touch-icon" href="./launchericon-192x192.png">

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('Service Worker registado:', reg.scope))
            .catch(err => console.log('Erro no Service Worker:', err));
        });
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .print-card { border: none !important; box-shadow: none !important; background: white !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <header class="bg-slate-800 border-b border-slate-700 py-6 px-4 shadow-lg no-print">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="./PrintArt.svg" alt="PrintArt3D Logo" class="h-10 w-auto">
                <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">
                    PrintArt3D
                </h1>
            </div>
            <span class="text-xs bg-slate-700 text-slate-300 px-3 py-1 rounded-full font-medium border border-slate-600">
                Calculadora de Custos
            </span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

        <!-- Formulário de Custos e Descrição -->
        <section class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-md no-print">
            <h2 class="text-lg font-semibold text-teal-400 mb-4">Parâmetros de Impressão</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Peso da Peça (g)</label>
                    <input type="number" id="pesoPeca" placeholder="Ex: 150" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Preço do Filamento (R$/kg)</label>
                    <input type="number" id="precoFilamento" placeholder="Ex: 100" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Tempo de Impressão (Horas)</label>
                    <input type="number" id="tempoImpressao" placeholder="Ex: 5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Consumo da Impressora (W)</label>
                    <input type="number" id="potenciaImpressora" value="350" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Custo de Energia (R$/kWh)</label>
                    <input type="number" id="custoKwh" value="0.90" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Margem de Lucro (%)</label>
                    <input type="number" id="margemLucro" value="100" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- Caixa de Texto Ampla para Descrição Longa (Logo abaixo de Margem e Riscos) -->
            <div class="mt-4">
                <label class="block text-sm font-medium text-teal-400 mb-1">Descrição Detalhada do Orçamento / Observações</label>
                <textarea id="descricaoInput" rows="5" placeholder="Escreva aqui todos os detalhes, especificações de filamento, acabamento ou prazos (suporta textos longos)..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
            </div>

            <button onclick="calcularCustos()" class="mt-6 w-full bg-gradient-to-r from-teal-500 to-blue-600 hover:from-teal-600 hover:to-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-200">
                Calcular e Gerar Orçamento
            </button>
        </section>

        <!-- Orçamento Impresso / Resultado -->
        <section id="resultado" class="hidden bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-md print-card">
            
            <div class="text-center pb-4 border-b border-slate-700 mb-4">
                <img src="./PrintArt.svg" alt="PrintArt3D" class="h-16 mx-auto mb-2">
                <h2 class="text-2xl font-bold text-slate-100 print:text-black">PrintArt3D</h2>
                <p class="text-sm text-slate-400 print:text-slate-600">Orçamento de Impressão 3D</p>
            </div>

            <div class="mb-4">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 print:text-slate-700">Descrição do Orçamento:</h3>
                <div id="displayDescricao" class="bg-slate-900/50 p-3 rounded-lg border border-slate-700 text-slate-200 font-medium whitespace-pre-line print:bg-slate-100 print:border-slate-300 print:text-black"></div>
            </div>

            <div class="space-y-2 border-t border-slate-700 pt-4 print:border-slate-300">
                <div class="flex justify-between text-slate-300 text-sm print:text-black">
                    <span>Custo de Material:</span>
                    <span id="custoMaterial" class="font-semibold">R$ 0,00</span>
                </div>
                <div class="flex justify-between text-slate-300 text-sm print:text-black">
                    <span>Custo de Energia:</span>
                    <span id="custoEnergia" class="font-semibold">R$ 0,00</span>
                </div>
                <div class="flex justify-between text-xl font-bold text-teal-400 pt-2 border-t border-slate-700 print:text-black print:border-slate-400">
                    <span>Valor Total do Orçamento:</span>
                    <span id="precoFinal">R$ 0,00</span>
                </div>
            </div>

            <button onclick="window.print()" class="mt-6 w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition no-print">
                Imprimir / Salvar PDF
            </button>
        </section>

    </main>

    <script>
        function calcularCustos() {
            const peso = parseFloat(document.getElementById('pesoPeca').value) || 0;
            const precoFil = parseFloat(document.getElementById('precoFilamento').value) || 0;
            const tempo = parseFloat(document.getElementById('tempoImpressao').value) || 0;
            const potencia = parseFloat(document.getElementById('potenciaImpressora').value) || 0;
            const kwh = parseFloat(document.getElementById('custoKwh').value) || 0;
            const margem = parseFloat(document.getElementById('margemLucro').value) || 0;
            const desc = document.getElementById('descricaoInput').value;

            const matCusto = (peso / 1000) * precoFil;
            const energCusto = (potencia / 1000) * tempo * kwh;
            const custoBase = matCusto + energCusto;
            const precoVenda = custoBase * (1 + (margem / 100));

            document.getElementById('displayDescricao').innerText = desc || 'Nenhuma descrição informada.';
            document.getElementById('custoMaterial').innerText = `R$ ${matCusto.toFixed(2)}`;
            document.getElementById('custoEnergia').innerText = `R$ ${energCusto.toFixed(2)}`;
            document.getElementById('precoFinal').innerText = `R$ ${precoVenda.toFixed(2)}`;

            document.getElementById('resultado').classList.remove('hidden');
        }
    </script>
</body>
</html>
